name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # =====================================================
      #  خطوات النشر: لا تُفشل الدفع إن لم تُضبط أسرار Vercel
      #  (secrets غير متاحة داخل if — لذا نمرّرها عبر env)
      # =====================================================
      - name: Check Vercel config
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "✅ أسرار Vercel موجودة"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::أسرار Vercel غير مُعرَّفة — تم تخطي النشر (البناء يبقى ناجحاً)"
            {
              echo "## ⚠️ تم تخطي النشر إلى Vercel"
              echo ""
              echo "الأسرار الناقصة: VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID"
              echo ""
              echo "أضفها من: Settings → Secrets and variables → Actions"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Deploy to Vercel (Production)
        if: github.ref == 'refs/heads/main' && steps.vercel.outputs.configured == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'

      - name: Deploy to Vercel (Preview)
        if: github.ref != 'refs/heads/main' && steps.vercel.outputs.configured == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
